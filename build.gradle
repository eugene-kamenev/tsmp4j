plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    id 'maven-publish'
}

group = 'com.github.eugene-kamenev'
    version = '1.2'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    api "org.apache.commons:commons-math3:$commonsMathVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"
}

tasks.named('test') {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

def env = [:]

def envFile = file('.env')

if (envFile.exists()) {
    envFile.eachLine { line ->
        line = line.trim()

        if (!line || line.startsWith('#')) {
            return
        }

        def parts = line.split('=', 2)

        if (parts.length == 2) {
            env[parts[0].trim()] = parts[1].trim()
        }
    }
}

def getEnv = { String name ->
    System.getenv(name) ?: env[name]
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'TSMP4J'
                description = 'Time Series with Matrix Profile in Java'
                url = 'https://github.com/eugene-kamenev/tsmp4j'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'eugene-kamenev'
                        name = 'Eugene Kamenev'
                        email = 'eugene.kamenev at gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/eugene-kamenev/tsmp4j.git'
                    url = 'https://github.com/eugene-kamenev/tsmp4j'
                }
            }
        }
    }
    repositories {
        maven {
            // Set the URL to your repository (local or remote)
            mavenLocal()
        }

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/eugene-kamenev/tsmp4j")
            credentials {
                username = project.findProperty("gpr.user") ?: getEnv("USERNAME")
                password = project.findProperty("gpr.password") ?: getEnv("TOKEN")
            }
        }
        if (getEnv('GITEA_URL') && getEnv('GITEA_TOKEN')) {
            maven {
                name = "Gitea"
                url = uri(getEnv('GITEA_URL'))
                allowInsecureProtocol = true
                credentials(HttpHeaderCredentials) {
                    name = "Authorization"
                    value = "token ${getEnv('GITEA_TOKEN')}"
                }

                authentication {
                    header(HttpHeaderAuthentication)
                }
            }
        }
    }
}
